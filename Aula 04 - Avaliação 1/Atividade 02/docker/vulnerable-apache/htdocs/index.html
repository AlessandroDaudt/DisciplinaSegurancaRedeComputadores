<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Portal de materiais — Aula 04</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 24px; color: #1f2937; }
    .card { border: 1px solid #d1d5db; border-radius: 12px; padding: 24px; background: #f9fafb; }
    code { background: #e5e7eb; padding: 2px 5px; border-radius: 4px; }
    .tag { display: inline-block; padding: 4px 9px; border-radius: 999px; background: #fef3c7; color: #92400e; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">Ambiente de laboratório</span>
    <h1>Portal de materiais</h1>
    <p>Este serviço existe exclusivamente para a atividade de descoberta, análise, exploração controlada e correção.</p>
    <p>O conteúdo público de apoio está em <code>/public/</code>.</p>
    <p>Escopo autorizado: <code>127.0.0.1:8080</code>.</p>
  </div>
</body>
</html>
