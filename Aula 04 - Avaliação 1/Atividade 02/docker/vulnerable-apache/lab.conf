ServerName localhost

# Mantém o cabeçalho informativo para a etapa de fingerprinting da aula.
ServerTokens Full
ServerSignature Off
TraceEnable Off

# Diretório exposto de propósito para criar o contexto Alias-like do laboratório.
Alias /public/ "/usr/local/apache2/lab-assets/"

<Directory "/usr/local/apache2/lab-assets">
    AllowOverride None
    Options None
    Require all granted
</Directory>

# Este diretório não possui uma rota pública normal. A permissão explícita
# representa a condição insegura que permite demonstrar a leitura após o
# desvio de caminho.
<Directory "/usr/local/apache2/lab-secrets">
    AllowOverride None
    Options None
    Require all granted
</Directory>
